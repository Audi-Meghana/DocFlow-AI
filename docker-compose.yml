services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: docflow-dev-secret
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
